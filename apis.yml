aid: augmentus
name: Augmentus
description: >-
  Augmentus is a no-code adaptive robotics company (founded 2019, offices in
  Singapore and Pflugerville, Texas) that turns industrial robots into AI-driven
  automation systems programmable without code or a teach pendant. Its platform
  pairs 3D scanning and computer vision with AI motion planning to auto-generate
  robot toolpaths for welding, surface finishing, spraying, sandblasting,
  sanding, and material removal across ABB, FANUC, KUKA, Yaskawa, Kawasaki,
  Universal Robots, and Techman arms — cutting process automation from weeks to
  minutes. Sold as Standard (CAD-based toolpaths) and Pro (vision-guided) tiers.
  Surfaced as a portfolio company of sierra-ventures; profiled here from public
  sources. Augmentus ships a desktop/on-prem product rather than a public web
  API, so this profile is identity-and-presence oriented.
